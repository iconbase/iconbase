name: check

# 数据自检 —— 与 service 仓的构建守同一套规矩(PR 与 push 都跑)。
#
# 同步 Simple Icons **不自动跑**:每周 SI 带来新品牌,收不收、许可怎么写、
# 索引怎么接,都要人(或 agent)按 iconbase/mneme 的 skill 走一遍 ——
# 盲跑脚本会把没分析过的品牌直接带进库里。
#
# 要同步时:按那个 skill 走。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # SVG 单行、索引与文件一一对应、分类登记、品牌许可记录齐备
      - run: node scripts/check.mjs
