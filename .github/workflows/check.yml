name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 数据自检 —— 与 service 仓的构建守同一套规矩
      # (SVG 单行、索引与文件一一对应、分类登记、品牌许可记录齐备)
      - run: node scripts/check.mjs
